# Publishes n8n-nodes-trendsfast to npm with a provenance statement when a version tag is pushed.
#
# Rendered from the @n8n/node-cli 0.54.4 template (`n8n-node release --init-workflow`), with the
# actions pinned to the commits their v4 tags pointed to on 2026-10-28.
#
# This file does nothing here: GitHub only runs workflows in a repository's root
# .github/workflows. The package is published from trendsfast-open/n8n-nodes-trendsfast, so
# before publishing, move this file to that repository's root, run its steps with
# working-directory n8n-nodes-trendsfast and a matching cache-dependency-path, and scope the
# tag trigger to this package's own tags. See "Before publishing" in README.md.
#
# n8n requires community nodes submitted for verification to be published from GitHub Actions
# with npm provenance (from May 1, 2026). Prerequisites: @n8n/node-cli >= 0.23.0, and either an
# npm Trusted Publisher for this repository and `publish.yml`, or an NPM_TOKEN repository secret.
#
# Release locally with `npm run release`: it lints, builds, bumps the version, updates the
# changelog, commits, tags and pushes. The tag push runs this workflow, which publishes.

name: Publish

on:
  push:
    tags:
      - "n8n-nodes-trendsfast@*.*.*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-nodes-trendsfast

    permissions:
      # Mints the OIDC token for the npm provenance attestation.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: n8n-nodes-trendsfast/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Release
        # Lint and build run as part of the release. With Trusted Publishing leave NPM_TOKEN
        # unset; with a token, it is written to .npmrc for this step only.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
