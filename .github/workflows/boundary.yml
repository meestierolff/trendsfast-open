name: Public agent tooling boundary

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    name: Boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Lint public runtime boundary
        run: node scripts/lint.mjs

      - name: Validate clean-room boundary
        run: node scripts/check-boundary.mjs

      - name: Check formatting
        run: npm run format:check

      - name: Build package
        run: npm run build

      - name: Verify committed build artifacts
        run: git diff --exit-code -- dist

      - name: Typecheck package
        run: npm run typecheck

      - name: Run synthetic tests
        run: npm test

      - name: Scan tracked files, full history and tarball for secrets
        run: npm run secret:scan

      - name: Audit dependency, license and package allowlists
        run: npm run package:audit

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify npm package dry run
        run: npm pack --dry-run --ignore-scripts
